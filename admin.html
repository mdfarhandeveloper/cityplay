<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        h1 { text-align: center; margin-bottom: 30px; color: #2c3e50; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media(max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; margin-bottom: 15px; font-size: 18px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #34495e; color: white; }
        input, button, select { width: 100%; padding: 10px; margin-top: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 15px; }
        button { background-color: #2ecc71; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-danger { background-color: #e74c3c; width: auto; padding: 5px 10px; display: inline-block;}
    </style>
</head>
<body>

    <div class="container">
        <h1>Admin Control Panel (Firebase)</h1>
        
        <div class="grid">
            <div class="card">
                <h2>User Management & Earning Control</h2>
                <table>
                    <thead>
                        <tr>
                            <th>User Name</th>
                            <th>Earning (Tk)</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body"></tbody>
                </table>
                
                <div style="margin-top: 20px; background: #f9f9f9; padding: 15px; border-radius: 5px;">
                    <h3>Change User Earning/Balance</h3>
                    <select id="user-select-list"><option value="">Select User</option></select>
                    <input type="number" id="new-balance-input" placeholder="Enter New Amount (Taka)">
                    <button onclick="changeUserBalance()">Update Balance</button>
                </div>
            </div>

            <div class="card">
                <h2>Upload / Change Tasks</h2>
                <form id="task-form" onsubmit="addNewTask(event)">
                    <input type="text" id="task-title" placeholder="Task Title" required>
                    <input type="url" id="task-url" placeholder="Task URL (https://...)" required>
                    <input type="number" id="task-amount" placeholder="Reward Amount (Taka)" required>
                    <button type="submit">Upload Task to App</button>
                </form>

                <h3 style="margin-top:20px;">Current Live Tasks:</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="admin-task-list"></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h2>Withdraw Requests (Month-End Payment Tracker)</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Method</th>
                        <th>Phone Number</th>
                        <th>Amount</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="withdraw-table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        // ⚠️ APNAR FIREBASE CONFIGURATION EKHANE BOSHAN
        const firebaseConfig = {
            apiKey: "AIzaSyCKITS8pdaBi1-icFyZ4CgPxsJe60uszio",
            authDomain: "ctx-9c92f.firebaseapp.com",
            databaseURL: "https://ctx-9c92f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ctx-9c92f",
            storageBucket: "ctx-9c92f.firebasestorage.app",
            messagingSenderId: "853150844818",
            appId: "1:853150844818:web:a4e4698526a6a61320a34b",
            measurementId: "G-TEEZQZLPMD"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Real-time sync with user lists
        database.ref('users').on('value', (snapshot) => {
            const userTable = document.getElementById('user-table-body');
            const userSelect = document.getElementById('user-select-list');
            userTable.innerHTML = '';
            userSelect.innerHTML = '<option value="">Select User</option>';
            
            let users = snapshot.val();
            if(users) {
                Object.keys(users).forEach(uid => {
                    let user = users[uid];
                    userTable.innerHTML += `<tr><td>${user.name}</td><td>${user.balance} Tk</td></tr>`;
                    userSelect.innerHTML += `<option value="${uid}">${user.name} (${user.balance} Tk)</option>`;
                });
            }
        });

        // Add task directly to firebase
        function addNewTask(e) {
            e.preventDefault();
            const title = document.getElementById('task-title').value;
            const url = document.getElementById('task-url').value;
            const amount = document.getElementById('task-amount').value;

            let taskRef = database.ref('tasks').push();
            taskRef.set({
                title: title,
                url: url,
                amount: Number(amount)
            }).then(() => {
                alert("Task live on App!");
                document.getElementById('task-form').reset();
            });
        }

        // Live Tasks view and delete
        database.ref('tasks').on('value', (snapshot) => {
            const taskList = document.getElementById('admin-task-list');
            taskList.innerHTML = '';
            let tasks = snapshot.val();
            if(tasks) {
                Object.keys(tasks).forEach(tid => {
                    taskList.innerHTML += `
                        <tr>
                            <td>${tasks[tid].title}</td>
                            <td>${tasks[tid].amount} Tk</td>
                            <td><button class="btn-danger" onclick="deleteTask('${tid}')">Delete</button></td>
                        </tr>
                    `;
                });
            } else {
                taskList.innerHTML = `<tr><td colspan="3" style="text-align:center;">No task uploaded yet!</td></tr>`;
            }
        });

        function deleteTask(tid) {
            if(confirm("Are you sure to remove this task?")) {
                database.ref('tasks/' + tid).remove();
            }
        }

        // Edit specific user balance
        function changeUserBalance() {
            const uid = document.getElementById('user-select-list').value;
            const amount = document.getElementById('new-balance-input').value;
            if(!uid || !amount) return alert("Select user and input amount!");

            database.ref('users/' + uid).update({
                balance: Number(amount)
            }).then(() => {
                alert("User Balance Updated!");
                document.getElementById('new-balance-input').value = '';
            });
        }

        // Withdraw Tracker
        database.ref('withdraw_requests').on('value', (snapshot) => {
            const table = document.getElementById('withdraw-table-body');
            table.innerHTML = '';
            let requests = snapshot.val();
            if(requests) {
                Object.keys(requests).forEach(id => {
                    let req = requests[id];
                    table.innerHTML += `
                        <tr>
                            <td>${req.name}</td>
                            <td style="text-transform:uppercase;"><b>${req.method}</b></td>
                            <td>${req.phone}</td>
                            <td>${req.amount} Tk</td>
                            <td style="color:orange; font-weight:bold;">${req.status}</td>
                        </tr>
                    `;
                });
            } else {
                table.innerHTML = `<tr><td colspan="5" style="text-align:center;">No withdraw request yet.</td></tr>`;
            }
        });
    </script>
</body>
</html>
