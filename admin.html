<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এডমিন ড্যাশবোর্ড</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-color: #151f32;
            --text-color: #f1f5f9;
            --accent-color: #38bdf8;
            --danger-color: #ef4444;
            --success-color: #22c55e;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
        .card {
            background-color: var(--card-color);
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
        }
        h2, h3 {
            margin-top: 0;
            border-bottom: 2px solid #1e293b;
            padding-bottom: 12px;
            color: var(--accent-color);
        }
        .stats {
            font-size: 20px;
            font-weight: bold;
            color: var(--success-color);
            margin-bottom: 15px;
        }
        .list-item {
            background: #1e293b;
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.02);
            transition: transform 0.2s;
        }
        .list-item:hover { transform: translateX(5px); }
        
        input, text {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px 0;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0b0f19;
            color: white;
            box-sizing: border-box;
        }
        input:focus { border-color: var(--accent-color); outline: none; }
        
        .btn-add {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white; border: none; padding: 12px 24px;
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px;
        }
        .btn-del {
            background-color: var(--danger-color);
            color: white; border: none; padding: 8px 14px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
        }
        .btn-appr {
            background-color: var(--success-color);
            color: white; border: none; padding: 8px 14px;
            border-radius: 6px; cursor: pointer; font-weight: 600;
        }
        .info-text { font-size: 14px; line-height: 1.6; }
        .badge {
            background: #334155; padding: 3px 8px;
            border-radius: 6px; font-size: 12px; color: var(--accent-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card" style="background: linear-gradient(135deg, #151f32, #1e293b);">
        <h2>মাস্টার এডমিন ম্যানেজমেন্ট প্যানেল</h2>
        <p style="color:#94a3b8; margin:0;">এখানে আপনি রিয়েল-টাইমে অ্যাপের ইউজার, টাস্ক এবং উইথড্র রিকোয়েস্ট নিয়ন্ত্রণ করতে পারবেন।</p>
    </div>

    <div class="card">
        <h3>➕ নতুন টাস্ক যুক্ত করুন</h3>
        <label>টাস্কের নাম / টাইটেল:</label>
        <input type="text" id="task-title" placeholder="যেমন: Join Telegram Channel বা Watch Ad">

        <label>টাস্ক লিংক (URL):</label>
        <input type="text" id="task-url" placeholder="https://example.com">

        <label>পুরস্কারের পরিমাণ (টাকা / BDT):</label>
        <input type="number" id="task-reward" placeholder="যেমন: 10">

        <button class="btn-add" onclick="addNewTask()">টাস্ক পাবলিশ করুন</button>
    </div>

    <div class="card">
        <h3>👥 নিবন্ধিত ইউজার তালিকা</h3>
        <div class="stats">মোট ইউজার সংখ্যা: <span id="total-users" style="color:var(--accent-color)">0</span> জন</div>
        <div id="users-list" style="max-height: 300px; overflow-y: auto;">
            ইউজার ডেটা লোড হচ্ছে...
        </div>
    </div>

    <div class="card">
        <h3>💰 উইথড্র রিকোয়েস্টসমূহ</h3>
        <div id="admin-requests" style="max-height: 400px; overflow-y: auto;">
            রিকোয়েস্ট লোড হচ্ছে...
        </div>
    </div>
</div>

<script>
    // --- FIREBASE CONFIGURATION (index.html এর সাথে মিল রাখুন) ---
    const firebaseConfig = {
    apiKey: "AIzaSyBUanIOP4g6OaJNTEceerm7kgk3oYxvXTs",
    authDomain: "device-streaming-5c9e8564.firebaseapp.com",
    databaseURL: "https://device-streaming-5c9e8564-default-rtdb.firebaseio.com",
    projectId: "device-streaming-5c9e8564",
    storageBucket: "device-streaming-5c9e8564.firebasestorage.app",
    messagingSenderId: "482804847649",
    appId: "1:482804847649:web:55e9dd02aac4aea37cbf60"
  };

    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // অ্যাপ চালুর সাথে সাথে লোড হবে
    loadUsers();
    loadWithdrawRequests();

    // --- ADD NEW TASK FUNCTION ---
    function addNewTask() {
        const title = document.getElementById('task-title').value;
        const url = document.getElementById('task-url').value;
        const reward = parseInt(document.getElementById('task-reward').value);

        if(!title || !url || !reward) {
            alert("অনুগ্রহ করে টাস্কের সব ঘর সঠিকভাবে পূরণ করুন!");
            return;
        }

        db.collection("tasks").add({
            title: title,
            url: url,
            reward: reward,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        }).then(() => {
            alert("টাস্কটি সফলভাবে তৈরি হয়েছে এবং ইউজার অ্যাপে লাইভ করা হয়েছে!");
            // ইনপুট ফিল্ড ক্লিয়ার করা
            document.getElementById('task-title').value = "";
            document.getElementById('task-url').value = "";
            document.getElementById('task-reward').value = "";
        }).catch((error) => {
            alert("টাস্ক যুক্ত করতে সমস্যা হয়েছে: " + error);
        });
    }

    // --- FETCH ALL USERS ---
    function loadUsers() {
        const container = document.getElementById('users-list');
        db.collection("users").get().then((querySnapshot) => {
            container.innerHTML = "";
            document.getElementById('total-users').innerText = querySnapshot.size;
            
            if(querySnapshot.empty) {
                container.innerHTML = "কোনো ইউজার পাওয়া যায়নি।";
                return;
            }

            querySnapshot.forEach((doc) => {
                const user = doc.data();
                container.innerHTML += `
                    <div class="list-item">
                        <div class="info-text">
                            নাম: <b>${user.name || 'গেস্ট'}</b> (ID: ${user.uid})<br>
                            ব্যালেন্স: <span style="color:var(--success-color)">${user.balance || 0} BDT</span> | রেফার: ${user.refers || 0}টি
                        </div>
                        <button class="btn-del" onclick="deleteUser('${doc.id}')">ডিলিট ইউজার</button>
                    </div>
                `;
            });
        });
    }

    // --- DELETE USER ---
    function deleteUser(uid) {
        if(confirm("আপনি কি নিশ্চিত যে এই ইউজারকে চিরতরে ডিলিট করতে চান?")) {
            db.collection("users").doc(uid).delete().then(() => {
                alert("ইউজার অ্যাকাউন্ট সফলভাবে ডিলিট করা হয়েছে।");
                loadUsers();
            });
        }
    }

    // --- FETCH WITHDRAW REQUESTS ---
    function loadWithdrawRequests() {
        const container = document.getElementById('admin-requests');
        db.collection("withdraws").orderBy("timestamp", "desc").get().then((querySnapshot) => {
            container.innerHTML = "";
            
            if(querySnapshot.empty) {
                container.innerHTML = "বর্তমানে কোনো উইথড্র রিকোয়েস্ট নেই।";
                return;
            }

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const accountLabel = (data.method === "Telegram Wallet") ? "ওয়ালেট অ্যাড্রেস" : "মোবাইল নম্বর";
                
                container.innerHTML += `
                    <div class="list-item" style="border-left: 4px solid ${data.status === 'Pending' ? '#f59e0b' : '#10b981'};">
                        <div class="info-text">
                            ইউজার: <b>${data.name}</b> (ID: ${data.uid})<br>
                            মেথড: <span class="badge">${data.method}</span><br>
                            টাকার পরিমাণ: <b style="color:var(--success-color)">${data.amount} BDT</b><br>
                            ${accountLabel}: <span style="color:var(--accent-color); font-weight:bold;">${data.account}</span><br>
                            স্ট্যাটাস: <b style="color:${data.status === 'Pending' ? '#f59e0b' : '#10b981'}">${data.status === 'Pending' ? 'পেন্ডিং (Pending)' : 'অ্যাপ্রুভড (Approved)'}</b>
                        </div>
                        ${data.status === 'Pending' ? `
                            <button class="btn-appr" onclick="approveWithdraw('${doc.id}')">অ্যাপ্রুভ করুন</button>
                        ` : ''}
                    </div>
                `;
            });
        });
    }

    // --- APPROVE WITHDRAW ---
    function approveWithdraw(docId) {
        if(confirm("আপনি কি নিশ্চিত যে এই রিকোয়েস্টটি অ্যাপ্রুভ বা পেমেন্ট সম্পন্ন করেছেন?")) {
            db.collection("withdraws").doc(docId).update({
                status: "Approved"
            }).then(() => {
                alert("রিকোয়েস্টটি সফলভাবে অ্যাপ্রুভ করা হয়েছে।");
                loadWithdrawRequests();
            });
        }
    }
</script>
</body>
</html>
