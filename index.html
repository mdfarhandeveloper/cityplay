<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTX Earning</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #1a1a2e; color: #fff; padding-bottom: 70px; }
        .container { padding: 20px; }
        .header { background: linear-gradient(135deg, #0f3460, #16213e); padding: 20px; border-radius: 0 0 20px 20px; text-align: center; }
        .header h2 { color: #4ecca3; font-size: 24px; }
        .card { background-color: #16213e; padding: 20px; border-radius: 15px; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .stat-box { background: #0f3460; padding: 15px; border-radius: 10px; text-align: center; }
        .stat-box h3 { font-size: 14px; color: #95a5a6; }
        .stat-box p { font-size: 20px; font-weight: bold; color: #4ecca3; margin-top: 5px; }
        .navbar { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #16213e; display: flex; justify-content: space-around; padding: 12px 0; border-top: 2px solid #0f3460; }
        .nav-item { color: #95a5a6; text-decoration: none; font-size: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { color: #4ecca3; font-weight: bold; }
        .page { display: none; }
        .page.active { display: block; }
        .btn { background: linear-gradient(135deg, #4ecca3, #23b285); color: #1a1a2e; border: none; padding: 12px 20px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn:disabled { background: #4a4a4a; color: #888; cursor: not-allowed; }
        input, select { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #0f3460; background: #0f3460; color: #fff; }
        .task-item { display: flex; justify-content: space-between; align-items: center; background: #0f3460; padding: 15px; border-radius: 10px; margin-bottom: 12px; }
        .task-info h4 { font-size: 16px; }
        .task-info p { color: #4ecca3; font-size: 13px; }
        .task-btn { background: #4ecca3; color: #1a1a2e; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .task-btn:disabled { background: #4a4a4a; color: #888; }
        .no-task { text-align: center; color: #95a5a6; padding: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h2 id="username">Loading...</h2>
        <p>Welcome to Mini App Earn</p>
    </div>

    <div class="container">
        <div id="home" class="page active">
            <div class="card">
                <h3>Dashboard</h3>
                <div class="stat-grid">
                    <div class="stat-box">
                        <h3>Total Earning</h3>
                        <p><span id="user-balance">0</span> Taka</p>
                    </div>
                    <div class="stat-box">
                        <h3>Total Refers</h3>
                        <p><span id="user-refers">0</span>/20</p>
                    </div>
                </div>
            </div>
        </div>

        <div id="refer" class="page">
            <div class="card">
                <h3>Refer & Earn</h3>
                <input type="text" id="refer-link" readonly value="">
                <button class="btn" onclick="copyRefer()">Copy Link</button>
                <button class="btn" style="background: #3498db; color: white;" onclick="simulateReferClick()">Simulate 1 Refer Click</button>
            </div>
        </div>

        <div id="tasks" class="page">
            <div class="card">
                <h3>Available Tasks</h3>
                <div id="task-container" style="margin-top: 15px;">
                    </div>
            </div>
        </div>

        <div id="withdraw" class="page">
            <div class="card">
                <h3>Withdraw Earnings</h3>
                <p>Minimum Withdraw: 1000 Taka</p>
                <form id="withdraw-form" onsubmit="handleWithdraw(event)">
                    <select id="withdraw-method">
                        <option value="bkash">bKash</option>
                        <option value="nagad">Nagad</option>
                    </select>
                    <input type="tel" id="withdraw-phone" placeholder="017XXXXXXXX" required pattern="[0-9]{11}">
                    <button type="submit" class="btn" id="withdraw-submit-btn">Withdraw Request</button>
                </form>
                <p id="withdraw-msg" style="margin-top: 15px; text-align: center; font-weight: bold;"></p>
            </div>
        </div>
    </div>

    <div class="navbar">
        <div class="nav-item active" onclick="switchTab('home', this)"><span>🏠</span>Home</div>
        <div class="nav-item" onclick="switchTab('refer', this)"><span>👥</span>Refer</div>
        <div class="nav-item" onclick="switchTab('tasks', this)"><span>📋</span>Tasks</div>
        <div class="nav-item" onclick="switchTab('withdraw', this)"><span>💰</span>Withdraw</div>
    </div>

    <script>
        // ⚠️ APNAR FIREBASE CONFIGURATION EKHANE BOSHAN
        const firebaseConfig = {
            apiKey: "AIzaSyCKITS8pdaBi1-icFyZ4CgPxsJe60uszio",
            authDomain: "ctx-9c92f.firebaseapp.com",
            databaseURL: "https://ctx-9c92f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ctx-9c92f",
            storageBucket: "ctx-9c92f.firebasestorage.app",
            messagingSenderId: "853150844818",
            appId: "1:853150844818:web:a4e4698526a6a61320a34b",
            measurementId: "G-TEEZQZLPMD"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // User Identity from Telegram
        let tg = window.Telegram?.WebApp;
        let userId = "demo_user_123"; 
        let userName = "Demo User";

        if(tg && tg.initDataUnsafe?.user) {
            tg.expand();
            userId = tg.initDataUnsafe.user.id.toString();
            userName = tg.initDataUnsafe.user.first_name;
        }
        document.getElementById('username').innerText = userName;
        document.getElementById('refer-link').value = "https://t.me/ctxcoin_bot/CTX?start=" + userId;

        // Firebase theke user data real-time e track kora
        database.ref('users/' + userId).on('value', (snapshot) => {
            let data = snapshot.val();
            if(!data) {
                // Notun user hole database e set hobe prothome 0 data diye
                data = { name: userName, balance: 0, refers: 0, completedTasks: "" };
                database.ref('users/' + userId).set(data);
            }
            
            document.getElementById('user-balance').innerText = data.balance || 0;
            document.getElementById('user-refers').innerText = data.refers || 0;

            // Withdraw eligibility check
            const withdrawBtn = document.getElementById('withdraw-submit-btn');
            if((data.refers || 0) < 20 || (data.balance || 0) < 1000) {
                withdrawBtn.disabled = true;
                withdrawBtn.innerText = "Locked (Need 20 Refers & 1000 Tk)";
            } else {
                withdrawBtn.disabled = false;
                withdrawBtn.innerText = "Withdraw Request";
            }
            
            // Task list refresh
            loadTasks(data.completedTasks || "");
        });

        function switchTab(pageId, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            element.classList.add('active');
        }

        // Real-time task rendering (kali thakle faka dekhabe, admin upload dile ekhane show korbe)
        function loadTasks(completedTasksString) {
            database.ref('tasks').once('value', (snapshot) => {
                const container = document.getElementById('task-container');
                container.innerHTML = '';
                let tasks = snapshot.val();
                
                if(!tasks) {
                    container.innerHTML = `<div class="no-task">No tasks available right now. Admin has not uploaded any tasks yet!</div>`;
                    return;
                }

                let completedList = completedTasksString.split(',').filter(Boolean);

                Object.keys(tasks).forEach(taskId => {
                    let task = tasks[taskId];
                    let isDone = completedList.includes(taskId);
                    
                    const taskDiv = document.createElement('div');
                    taskDiv.className = 'task-item';
                    taskDiv.innerHTML = `
                        <div class="task-info">
                            <h4>${task.title}</h4>
                            <p>+${task.amount} Taka</p>
                        </div>
                        <button class="task-btn" ${isDone ? 'disabled' : ''} onclick="doTask('${task.url}', '${taskId}', ${task.amount})">
                            ${isDone ? 'Done' : 'Start'}
                        </button>
                    `;
                    container.appendChild(taskDiv);
                });
            });
        }

        function doTask(url, taskId, amount) {
            window.open(url, '_blank');
            setTimeout(() => {
                database.ref('users/' + userId).once('value', (snapshot) => {
                    let user = snapshot.val();
                    let completed = user.completedTasks || "";
                    let completedList = completed.split(',').filter(Boolean);
                    
                    if(!completedList.includes(taskId)) {
                        completedList.push(taskId);
                        let newCompletedString = completedList.join(',');
                        let newBalance = (user.balance || 0) + Number(amount);
                        
                        database.ref('users/' + userId).update({
                            balance: newBalance,
                            completedTasks: newCompletedString
                        });
                        alert(`Task Completed! +${amount} Tk added.`);
                    }
                });
            }, 2000);
        }

        function simulateReferClick() {
            database.ref('users/' + userId).once('value', (snapshot) => {
                let user = snapshot.val();
                let currentRefers = user.refers || 0;
                database.ref('users/' + userId).update({ refers: currentRefers + 1 });
            });
        }

        function copyRefer() {
            const copyText = document.getElementById("refer-link");
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Refer link copied!");
        }

        function handleWithdraw(e) {
            e.preventDefault();
            const method = document.getElementById('withdraw-method').value;
            const phone = document.getElementById('withdraw-phone').value;
            
            database.ref('users/' + userId).once('value', (snapshot) => {
                let user = snapshot.val();
                if(user.balance >= 1000 && user.refers >= 20) {
                    let withdrawRef = database.ref('withdraw_requests').push();
                    withdrawRef.set({
                        userId: userId,
                        name: user.name,
                        method: method,
                        phone: phone,
                        amount: user.balance,
                        status: 'Pending'
                    });

                    database.ref('users/' + userId).update({ balance: 0 });
                    document.getElementById('withdraw-msg').innerText = "Withdraw request submitted successfully!";
                }
            });
        }
    </script>
</body>
</html>
